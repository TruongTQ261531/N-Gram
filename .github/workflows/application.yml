name: Verify browser application and exact audit data
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent full-text enumeration and browser engine
        run: node webapp/test-engine.mjs
      - name: Test possible-result pools, finite-state membership and cached ranking
        run: node webapp/test-pool.mjs
      - name: Verify every published integer rank, conflict edge and dataset source
        run: python application_study/check_archive.py
