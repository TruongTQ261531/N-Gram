name: Verify integrated research archive
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-verification dependencies
        run: pip install -r requirements-all.txt
      - name: Verify all recorded research stages and integration manifests
        run: python verify_all.py
