name: Verify integrated research archive
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-verification dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3
      - name: Verify both studies and integration manifests
        run: python verify_all.py
