name: Verify complete finite-edit possible-result pools
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent offline verifier dependency
        run: pip install numpy==2.3.5
      - name: Replay every finite state, cached top-k set and conditional cover
        run: python pool_study/check_archive.py
