name: Verify discrete n-gram retention method
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: round3/requirements.txt
      - run: pip install -r round3/requirements.txt
      - name: Verify preconfirmation source and query selection
        run: python round3/verify_freeze.py
      - name: Check exact, relaxed, discrete and numerical components
        run: python -m unittest discover -s round3 -p 'test_*.py'
